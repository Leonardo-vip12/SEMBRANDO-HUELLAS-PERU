version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: sh-postgres-staging
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-staging_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staging_secure_pass}
      POSTGRES_DB: ${DB_NAME:-sembrando_huellas_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - sh-staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-staging_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sh-redis-staging
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-staging_redis_pass}"
    volumes:
      - redis_staging_data:/data
    networks:
      - sh-staging-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-staging_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-20T22-40-07Z
    container_name: sh-minio-staging
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-staging_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-staging_minio_pass}
    volumes:
      - minio_staging_data:/data
    networks:
      - sh-staging-net

  backend:
    build:
      context: ./sembrando-huellas-backend
      dockerfile: Dockerfile
    container_name: sh-backend-staging
    restart: always
    environment:
      NODE_ENV: staging
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-staging_user}:${DB_PASSWORD:-staging_secure_pass}@postgres:5432/${DB_NAME:-sembrando_huellas_staging}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-staging_redis_pass}
    networks:
      - sh-staging-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./sembrando-huellas
      dockerfile: Dockerfile
    container_name: sh-frontend-staging
    restart: always
    ports:
      - "80:80"
    networks:
      - sh-staging-net
    depends_on:
      - backend

networks:
  sh-staging-net:
    driver: bridge

volumes:
  postgres_staging_data:
  redis_staging_data:
  minio_staging_data:
