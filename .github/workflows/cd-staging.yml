name: CD Pipeline - Deploy to Staging

on:
  push:
    branches: [ develop ]

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./sembrando-huellas-backend
          file: ./sembrando-huellas-backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:staging

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./sembrando-huellas
          file: ./sembrando-huellas/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:staging

      - name: Deploy to Staging Cluster
        run: |
          echo "Deploying to Staging Kubernetes namespace..."
          # kubectl apply -f k8s/ --namespace sembrando-huellas-staging
          # kubectl rollout status deployment/sh-backend -n sembrando-huellas-staging
