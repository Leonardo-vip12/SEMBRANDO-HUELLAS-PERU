name: CI Pipeline - Code Quality, Test & Build

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test-frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sembrando-huellas/package-lock.json

      - name: Install Dependencies
        run: |
          cd sembrando-huellas
          npm ci

      - name: Run Linter & Formatter Check
        run: |
          cd sembrando-huellas
          npm run lint || true

      - name: Build Frontend
        run: |
          cd sembrando-huellas
          npm run build

  lint-and-test-backend:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sembrando_huellas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sembrando-huellas-backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd sembrando-huellas-backend
          npm ci

      - name: Prisma Generate
        run: |
          cd sembrando-huellas-backend
          npx prisma generate

      - name: Run Linter
        run: |
          cd sembrando-huellas-backend
          npm run lint || true

      - name: Run Unit Tests
        run: |
          cd sembrando-huellas-backend
          npm run test -- --passWithNoTests

      - name: Build Backend API
        run: |
          cd sembrando-huellas-backend
          npm run build

  docker-build:
    name: Build Docker Images
    needs: [lint-and-test-frontend, lint-and-test-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./sembrando-huellas
          file: ./sembrando-huellas/Dockerfile
          push: false
          tags: sembrando-huellas/frontend:test

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./sembrando-huellas-backend
          file: ./sembrando-huellas-backend/Dockerfile
          push: false
          tags: sembrando-huellas/backend:test
