name: CD Pipeline - Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy-production:
    name: Production Deployment with Manual Approval
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Production Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./sembrando-huellas-backend
          file: ./sembrando-huellas-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build & Push Production Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./sembrando-huellas
          file: ./sembrando-huellas/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Deploy to Production Kubernetes Cluster
        run: |
          echo "Deploying to Production Kubernetes namespace..."
          # kubectl apply -f k8s/ --namespace sembrando-huellas-prod
          # kubectl set image deployment/sh-backend backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n sembrando-huellas-prod

      - name: Health Check & Automatic Rollback on Failure
        run: |
          echo "Verifying deployment health status..."
          # kubectl rollout status deployment/sh-backend -n sembrando-huellas-prod --timeout=120s || (echo "Deployment failed! Triggering automatic rollback..." && kubectl rollout undo deployment/sh-backend -n sembrando-huellas-prod && exit 1)
