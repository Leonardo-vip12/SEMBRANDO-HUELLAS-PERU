<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#143528;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D2B1A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D6A4F;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1B4332;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Water surface -->
  <rect x="0" y="320" width="800" height="280" fill="url(#water)" />
  <!-- Water ripples -->
  <ellipse cx="400" cy="340" rx="200" ry="20" fill="none" stroke="#52B788" stroke-width="0.8" opacity="0.15" />
  <ellipse cx="400" cy="360" rx="280" ry="25" fill="none" stroke="#52B788" stroke-width="0.6" opacity="0.1" />
  <!-- Dolphin body -->
  <path d="M280 370 Q320 340 380 335 Q440 330 500 345 Q530 355 540 370 Q530 390 500 400 Q440 415 380 412 Q320 410 280 390Z" fill="#95D5B2" opacity="0.25" />
  <path d="M290 372 Q330 348 385 342 Q440 337 495 350 Q520 358 530 370 Q520 385 495 395 Q440 408 385 405 Q330 403 290 388Z" fill="#B7E4C7" opacity="0.15" />
  <!-- Dorsal fin -->
  <path d="M420 335 L435 310 L450 335" fill="#95D5B2" opacity="0.2" />
  <!-- Flippers -->
  <path d="M350 385 Q330 405 340 415 Q355 410 360 395" fill="#95D5B2" opacity="0.18" />
  <!-- Snout (long beak) -->
  <path d="M280 370 Q260 365 250 370 Q260 375 280 372" fill="#95D5B2" opacity="0.2" />
  <!-- Eye -->
  <circle cx="300" cy="362" r="3.5" fill="#0D2B1A" opacity="0.4" />
  <circle cx="300" cy="362" r="1.5" fill="white" opacity="0.2" />
  <!-- Smile line -->
  <path d="M270 373 Q285 378 300 375" stroke="#95D5B2" stroke-width="1" fill="none" opacity="0.15" />
  <!-- Tail -->
  <path d="M540 370 Q565 360 580 340" stroke="#95D5B2" stroke-width="4" fill="none" opacity="0.2" stroke-linecap="round" />
  <path d="M540 370 Q565 380 580 400" stroke="#95D5B2" stroke-width="4" fill="none" opacity="0.2" stroke-linecap="round" />
  <!-- Bubbles -->
  <circle cx="270" cy="355" r="3" fill="none" stroke="#52B788" stroke-width="0.8" opacity="0.2" />
  <circle cx="260" cy="345" r="2" fill="none" stroke="#52B788" stroke-width="0.6" opacity="0.15" />
  <circle cx="275" cy="340" r="1.5" fill="none" stroke="#52B788" stroke-width="0.5" opacity="0.12" />
  <!-- Title -->
  <text x="400" y="120" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Delfín Rosado</text>
  <text x="400" y="150" font-family="Georgia,serif" font-size="14" font-style="italic" fill="#95D5B2" opacity="0.7" text-anchor="middle">Inia geoffrensis</text>
  <text x="400" y="570" font-family="Arial,sans-serif" font-size="10" fill="white" opacity="0.35" text-anchor="middle">Sembrando Huellas Perú</text>
</svg>