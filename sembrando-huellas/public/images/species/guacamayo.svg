<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B4332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D2B1A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Tropical canopy -->
  <ellipse cx="300" cy="150" rx="200" ry="80" fill="#2D6A4F" opacity="0.2" />
  <ellipse cx="550" cy="140" rx="180" ry="70" fill="#1B4332" opacity="0.25" />
  <!-- Tree branch -->
  <path d="M200 280 Q300 260 500 290 Q600 300 700 280" stroke="#5C4033" stroke-width="8" fill="none" opacity="0.25" />
  <path d="M500 290 Q550 310 580 350" stroke="#5C4033" stroke-width="4" fill="none" opacity="0.2" />
  <!-- Macaw body -->
  <ellipse cx="400" cy="265" rx="55" ry="28" fill="#D90429" opacity="0.35" />
  <ellipse cx="400" cy="262" rx="50" ry="24" fill="#E85D2C" opacity="0.28" />
  <!-- Wing -->
  <path d="M370 255 Q340 230 320 260 Q340 275 370 270Z" fill="#2D6A4F" opacity="0.3" />
  <path d="M365 258 Q345 240 330 260" stroke="#40916C" stroke-width="1" fill="none" opacity="0.2" />
  <!-- Head -->
  <circle cx="345" cy="250" r="18" fill="#FFD166" opacity="0.35" />
  <!-- Eye area (white) -->
  <circle cx="338" cy="248" r="7" fill="white" opacity="0.15" />
  <!-- Eye -->
  <circle cx="338" cy="248" r="3" fill="#0D2B1A" opacity="0.5" />
  <circle cx="338" cy="248" r="1.2" fill="white" opacity="0.3" />
  <!-- Beak (large, curved) -->
  <path d="M330 253 L310 260 L320 265 L330 260" fill="#1B4332" opacity="0.4" />
  <path d="M330 253 L315 255 L310 260" fill="#5C4033" opacity="0.3" />
  <!-- Tail feathers (long) -->
  <path d="M455 270 Q500 300 520 380" stroke="#D90429" stroke-width="4" fill="none" opacity="0.25" />
  <path d="M452 272 Q490 305 510 390" stroke="#2D6A4F" stroke-width="3.5" fill="none" opacity="0.22" />
  <path d="M458 274 Q510 310 530 395" stroke="#FFD166" stroke-width="3" fill="none" opacity="0.18" />
  <!-- Feet gripping branch -->
  <path d="M385 285 L380 295 L385 292" stroke="#5C4033" stroke-width="2" fill="none" opacity="0.25" />
  <path d="M415 285 L420 295 L415 292" stroke="#5C4033" stroke-width="2" fill="none" opacity="0.25" />
  <!-- Forest floor -->
  <rect x="0" y="450" width="800" height="150" fill="#143528" opacity="0.15" />
  <!-- Title -->
  <text x="400" y="100" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Guacamayo</text>
  <text x="400" y="130" font-family="Georgia,serif" font-size="14" font-style="italic" fill="#95D5B2" opacity="0.7" text-anchor="middle">Ara macao</text>
  <text x="400" y="570" font-family="Arial,sans-serif" font-size="10" fill="white" opacity="0.35" text-anchor="middle">Sembrando Huellas Perú</text>
</svg>