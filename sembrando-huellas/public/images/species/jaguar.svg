<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6348;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Dense jungle background -->
  <ellipse cx="200" cy="180" rx="150" ry="100" fill="#1B4332" opacity="0.3" />
  <ellipse cx="500" cy="160" rx="180" ry="110" fill="#1B4332" opacity="0.25" />
  <ellipse cx="700" cy="200" rx="130" ry="90" fill="#1B4332" opacity="0.3" />
  <!-- Tree trunks -->
  <rect x="120" y="200" width="15" height="300" fill="#5C4033" opacity="0.25" />
  <rect x="650" y="220" width="12" height="280" fill="#5C4033" opacity="0.2" />
  <!-- Jaguar body -->
  <ellipse cx="400" cy="350" rx="100" ry="50" fill="#FFD166" opacity="0.2" />
  <ellipse cx="400" cy="345" rx="95" ry="45" fill="#E8A838" opacity="0.18" />
  <!-- Spots/rosettes -->
  <circle cx="360" cy="335" r="6" fill="#8B6914" opacity="0.12" />
  <circle cx="385" cy="325" r="5" fill="#8B6914" opacity="0.1" />
  <circle cx="415" cy="330" r="6" fill="#8B6914" opacity="0.12" />
  <circle cx="440" cy="340" r="5" fill="#8B6914" opacity="0.1" />
  <circle cx="370" cy="355" r="5" fill="#8B6914" opacity="0.1" />
  <circle cx="425" cy="355" r="6" fill="#8B6914" opacity="0.12" />
  <!-- Head -->
  <ellipse cx="310" cy="330" rx="40" ry="32" fill="#FFD166" opacity="0.22" />
  <!-- Ears -->
  <ellipse cx="285" cy="300" rx="12" ry="10" fill="#E8A838" opacity="0.2" transform="rotate(-15 285 300)" />
  <ellipse cx="335" cy="300" rx="12" ry="10" fill="#E8A838" opacity="0.2" transform="rotate(15 335 300)" />
  <!-- Eyes -->
  <ellipse cx="298" cy="325" rx="5" ry="4" fill="#52B788" opacity="0.35" />
  <circle cx="298" cy="325" r="2.5" fill="#0D2B1A" opacity="0.5" />
  <ellipse cx="322" cy="325" rx="5" ry="4" fill="#52B788" opacity="0.35" />
  <circle cx="322" cy="325" r="2.5" fill="#0D2B1A" opacity="0.5" />
  <!-- Nose -->
  <ellipse cx="310" cy="335" rx="6" ry="4" fill="#C4956A" opacity="0.2" />
  <!-- Whiskers -->
  <line x1="290" y1="338" x2="260" y2="332" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" />
  <line x1="290" y1="342" x2="258" y2="342" stroke="rgba(255,255,255,0.12)" stroke-width="0.8" />
  <line x1="330" y1="338" x2="360" y2="332" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" />
  <line x1="330" y1="342" x2="362" y2="342" stroke="rgba(255,255,255,0.12)" stroke-width="0.8" />
  <!-- Legs -->
  <rect x="340" y="380" width="18" height="50" fill="#E8A838" opacity="0.15" rx="5" />
  <rect x="375" y="382" width="18" height="48" fill="#E8A838" opacity="0.15" rx="5" />
  <rect x="420" y="380" width="18" height="50" fill="#E8A838" opacity="0.15" rx="5" />
  <rect x="455" y="382" width="18" height="48" fill="#E8A838" opacity="0.15" rx="5" />
  <!-- Tail -->
  <path d="M500 345 Q540 330 560 350 Q570 370 550 380" stroke="#E8A838" stroke-width="6" fill="none" opacity="0.15" stroke-linecap="round" />
  <!-- Ground foliage -->
  <ellipse cx="300" cy="435" rx="40" ry="10" fill="#2D6A4F" opacity="0.15" />
  <ellipse cx="500" cy="430" rx="35" ry="8" fill="#2D6A4F" opacity="0.12" />
  <!-- Title -->
  <text x="400" y="110" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Jaguar</text>
  <text x="400" y="140" font-family="Georgia,serif" font-size="14" font-style="italic" fill="#95D5B2" opacity="0.7" text-anchor="middle">Panthera onca</text>
  <text x="400" y="570" font-family="Arial,sans-serif" font-size="10" fill="white" opacity="0.35" text-anchor="middle">Sembrando Huellas Perú</text>
</svg>