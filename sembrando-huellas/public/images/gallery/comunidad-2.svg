<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B4332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#143528;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Handshake / partnership -->
  <path d="M300 290 Q320 280 340 290 Q350 295 360 290 L380 280" stroke="#C4956A" stroke-width="4" fill="none" opacity="0.25" stroke-linecap="round" />
  <path d="M500 290 Q480 280 460 290 Q450 295 440 290 L420 280" stroke="#C4956A" stroke-width="4" fill="none" opacity="0.25" stroke-linecap="round" />
  <!-- Left hand -->
  <ellipse cx="310" cy="292" rx="25" ry="15" fill="#C4956A" opacity="0.2" />
  <!-- Right hand -->
  <ellipse cx="490" cy="292" rx="25" ry="15" fill="#C4956A" opacity="0.2" />
  <!-- Clasp -->
  <ellipse cx="400" cy="288" rx="20" ry="12" fill="#C4956A" opacity="0.22" />
  <!-- People around -->
  <circle cx="180" cy="340" r="14" fill="#143528" opacity="0.3" />
  <circle cx="240" cy="330" r="14" fill="#143528" opacity="0.25" />
  <circle cx="560" cy="330" r="14" fill="#143528" opacity="0.25" />
  <circle cx="620" cy="340" r="14" fill="#143528" opacity="0.3" />
  <!-- Trees -->
  <rect x="80" y="200" width="6" height="130" fill="#5C4033" opacity="0.25" />
  <polygon points="83,160 60,210 106,210" fill="#2D6A4F" opacity="0.3" />
  <rect x="710" y="210" width="6" height="120" fill="#5C4033" opacity="0.25" />
  <polygon points="713,170 690,220 736,220" fill="#2D6A4F" opacity="0.3" />
  <!-- Ground -->
  <rect x="0" y="380" width="800" height="220" fill="#143528" opacity="0.2" />
  <!-- Title -->
  <text x="400" y="120" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Comunidad — Galería 2</text>
  <text x="400" y="145" font-family="Arial,sans-serif" font-size="11" fill="#95D5B2" opacity="0.6" text-anchor="middle">Sembrando Huellas Perú</text>
</svg>