<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2B1A"/>
      <stop offset="100%" stop-color="#143528"/>
    </linearGradient>
  </defs>
  <rect width="200" height="60" rx="6" fill="url(#bg)"/>
  <!-- Tree icon (Rainforest Alliance style) -->
  <g transform="translate(12, 4)">
    <!-- Tree canopy -->
    <ellipse cx="14" cy="14" rx="12" ry="10" fill="#2D6A4F"/>
    <ellipse cx="10" cy="12" rx="8" ry="8" fill="#40916C"/>
    <ellipse cx="18" cy="12" rx="8" ry="8" fill="#40916C"/>
    <ellipse cx="14" cy="10" rx="7" ry="7" fill="#52B788"/>
    <!-- Frog face (RA signature) -->
    <circle cx="10" cy="9" r="2" fill="#95D5B2"/>
    <circle cx="18" cy="9" r="2" fill="#95D5B2"/>
    <circle cx="10" cy="9" r="1" fill="#0D2B1A"/>
    <circle cx="18" cy="9" r="1" fill="#0D2B1A"/>
    <path d="M12 13c1 1 3 1 4 0" stroke="#0D2B1A" stroke-width="0.8" fill="none"/>
    <!-- Trunk -->
    <rect x="12" y="22" width="4" height="10" fill="#1B4332" rx="1"/>
    <!-- Roots -->
    <path d="M12 32c-3 2-4 4-3 6" stroke="#1B4332" stroke-width="1.5" fill="none"/>
    <path d="M16 32c3 2 4 4 3 6" stroke="#1B4332" stroke-width="1.5" fill="none"/>
  </g>
  <!-- RA text -->
  <text x="52" y="36" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white" opacity="0.95">RA</text>
</svg>