<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2B1A"/>
      <stop offset="100%" stop-color="#143528"/>
    </linearGradient>
  </defs>
  <rect width="200" height="60" rx="6" fill="url(#bg)"/>
  <!-- Book/graduation icon -->
  <g transform="translate(10, 6)">
    <!-- Open book -->
    <path d="M2 8h12v22H2V8z" fill="#1B4332" stroke="#40916C" stroke-width="1.2"/>
    <path d="M14 8h12v22H14V8z" fill="#2D6A4F" stroke="#40916C" stroke-width="1.2"/>
    <line x1="14" y1="8" x2="14" y2="30" stroke="#52B788" stroke-width="1.5"/>
    <!-- Graduation cap -->
    <polygon points="14,2 2,8 14,12 26,8" fill="#52B788" opacity="0.8"/>
    <line x1="14" y1="12" x2="14" y2="16" stroke="#95D5B2" stroke-width="1"/>
    <path d="M8 10v6c0 2 3 4 6 4s6-2 6-4v-6" fill="none" stroke="#95D5B2" stroke-width="0.8"/>
    <!-- Book lines -->
    <line x1="5" y1="14" x2="12" y2="14" stroke="#52B788" stroke-width="0.6"/>
    <line x1="5" y1="17" x2="12" y2="17" stroke="#52B788" stroke-width="0.6"/>
    <line x1="5" y1="20" x2="12" y2="20" stroke="#52B788" stroke-width="0.6"/>
    <line x1="16" y1="14" x2="23" y2="14" stroke="#52B788" stroke-width="0.6"/>
    <line x1="16" y1="17" x2="23" y2="17" stroke="#52B788" stroke-width="0.6"/>
  </g>
  <!-- LA MOLINA text -->
  <text x="50" y="30" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="white" opacity="0.95">LA MOLINA</text>
  <text x="50" y="44" font-family="Georgia, serif" font-size="9" fill="white" opacity="0.7">Universidad</text>
</svg>