<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="25%" stop-color="#2D6A4F"/>
      <stop offset="50%" stop-color="#40916C"/>
      <stop offset="75%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#95D5B2"/>
    </linearGradient>
    <linearGradient id="circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#52B788"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Background foliage pattern -->
  <g opacity="0.15">
    <ellipse cx="100" cy="100" rx="40" ry="30" fill="#0D2B1A" transform="rotate(15, 100, 100)"/>
    <ellipse cx="700" cy="500" rx="50" ry="35" fill="#0D2B1A" transform="rotate(-10, 700, 500)"/>
    <ellipse cx="650" cy="100" rx="35" ry="25" fill="#143528" transform="rotate(25, 650, 100)"/>
  </g>
  
  <!-- Book/education icons -->
  <g transform="translate(100, 450)" opacity="0.2">
    <rect x="0" y="5" width="15" height="20" rx="1" fill="#0D2B1A"/>
    <rect x="15" y="5" width="15" height="20" rx="1" fill="#143528"/>
    <line x1="15" y1="5" x2="15" y2="25" stroke="#52B788" stroke-width="1"/>
    <line x1="4" y1="10" x2="12" y2="10" stroke="#52B788" stroke-width="0.8"/>
    <line x1="4" y1="14" x2="12" y2="14" stroke="#52B788" stroke-width="0.8"/>
    <line x1="18" y1="10" x2="26" y2="10" stroke="#52B788" stroke-width="0.8"/>
    <line x1="18" y1="14" x2="26" y2="14" stroke="#52B788" stroke-width="0.8"/>
  </g>
  
  <!-- Leaf/butterfly decorations -->
  <g transform="translate(680, 120)" opacity="0.2">
    <ellipse cx="-5" cy="0" rx="8" ry="5" fill="#52B788" transform="rotate(-20)"/>
    <ellipse cx="5" cy="0" rx="8" ry="5" fill="#52B788" transform="rotate(20)"/>
    <rect x="-0.5" y="-8" width="1" height="16" fill="#40916C"/>
  </g>
  
  <!-- Background trees -->
  <ellipse cx="200" cy="380" rx="60" ry="40" fill="#1B4332" opacity="0.3"/>
  <ellipse cx="600" cy="385" rx="55" ry="38" fill="#1B4332" opacity="0.25"/>
  
  <!-- Avatar circle -->
  <circle cx="400" cy="220" r="110" fill="url(#circle)" opacity="0.3"/>
  <circle cx="400" cy="220" r="95" fill="#1B4332" opacity="0.7"/>
  
  <!-- Initials -->
  <text x="400" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="80" fill="#95D5B2" font-weight="bold" opacity="0.9">LF</text>
  
  <!-- Person silhouette -->
  <circle cx="400" cy="185" r="22" fill="#52B788" opacity="0.25"/>
  <path d="M368 230c0-28 14-45 32-45s32 17 32 45v22h-64v-22z" fill="#52B788" opacity="0.15"/>
  
  <!-- Name -->
  <text x="400" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="white" opacity="0.9" font-weight="bold">Lucía Fernández</text>
  
  <!-- Role -->
  <text x="400" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#95D5B2" opacity="0.85">Coordinadora de Educación Ambiental</text>
  
  <!-- Decorative line -->
  <line x1="280" y1="445" x2="520" y2="445" stroke="#52B788" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Education/seedling icon -->
  <g transform="translate(400, 500)" opacity="0.35">
    <rect x="-1.5" y="0" width="3" height="12" fill="#40916C"/>
    <path d="M1.5 5c5-3 8-7 7-11c-4 1-6 5-7 11z" fill="#52B788"/>
    <path d="M-1.5 3c-5-3-8-7-7-11c4 1 6 5 7 11z" fill="#52B788"/>
    <circle cx="0" cy="-12" r="4" fill="#95D5B2" opacity="0.5"/>
  </g>
  
  <!-- Bottom text -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" opacity="0.5">Sembrando Huellas Perú</text>
</svg>