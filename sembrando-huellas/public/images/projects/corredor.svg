<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6A4F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tree1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1B4332" />
      <stop offset="100%" style="stop-color:#40916C" />
    </linearGradient>
    <linearGradient id="tree2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2D6A4F" />
      <stop offset="100%" style="stop-color:#52B788" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Mountains -->
  <path d="M0 420 L200 280 L400 380 L600 260 L800 350 L800 600 L0 600Z" fill="#1B4332" opacity="0.3" />
  <path d="M0 480 L150 360 L350 420 L550 320 L750 400 L800 380 L800 600 L0 600Z" fill="#143528" opacity="0.4" />
  <!-- Corridor path -->
  <path d="M300 580 Q400 480 500 580" stroke="#52B788" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="8,6" />
  <!-- Trees - left cluster -->
  <rect x="118" y="370" width="8" height="40" fill="#5C4033" opacity="0.6" />
  <polygon points="122,310 90,380 154,380" fill="url(#tree1)" opacity="0.8" />
  <polygon points="122,330 98,385 146,385" fill="url(#tree2)" opacity="0.7" />
  <rect x="178" y="350" width="8" height="50" fill="#5C4033" opacity="0.6" />
  <polygon points="182,280 145,360 219,360" fill="url(#tree1)" opacity="0.85" />
  <polygon points="182,305 155,365 209,365" fill="url(#tree2)" opacity="0.75" />
  <rect x="238" y="360" width="7" height="40" fill="#5C4033" opacity="0.5" />
  <polygon points="241,305 215,365 268,365" fill="url(#tree1)" opacity="0.7" />
  <!-- Trees - center -->
  <rect x="378" y="330" width="10" height="55" fill="#5C4033" opacity="0.6" />
  <polygon points="383,250 340,340 426,340" fill="url(#tree1)" opacity="0.9" />
  <polygon points="383,280 350,345 416,345" fill="url(#tree2)" opacity="0.8" />
  <rect x="418" y="340" width="8" height="45" fill="#5C4033" opacity="0.5" />
  <polygon points="422,275 392,350 452,350" fill="url(#tree1)" opacity="0.8" />
  <polygon points="422,300 398,352 446,352" fill="url(#tree2)" opacity="0.7" />
  <!-- Trees - right cluster -->
  <rect x="558" y="340" width="9" height="50" fill="#5C4033" opacity="0.6" />
  <polygon points="562,270 525,350 600,350" fill="url(#tree1)" opacity="0.85" />
  <polygon points="562,298 535,355 590,355" fill="url(#tree2)" opacity="0.75" />
  <rect x="618" y="355" width="7" height="40" fill="#5C4033" opacity="0.5" />
  <polygon points="621,298 595,360 648,360" fill="url(#tree1)" opacity="0.75" />
  <rect x="678" y="345" width="8" height="45" fill="#5C4033" opacity="0.5" />
  <polygon points="682,275 650,355 714,355" fill="url(#tree1)" opacity="0.8" />
  <polygon points="682,300 658,357 706,357" fill="url(#tree2)" opacity="0.7" />
  <!-- Birds -->
  <path d="M300 180 Q310 170 320 180" stroke="#52B788" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M340 160 Q348 152 356 160" stroke="#52B788" stroke-width="1.5" fill="none" opacity="0.3" />
  <path d="M480 190 Q488 182 496 190" stroke="#52B788" stroke-width="1.5" fill="none" opacity="0.35" />
  <!-- Title -->
  <text x="400" y="140" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Corredor Biológico</text>
  <text x="400" y="170" font-family="Arial,sans-serif" font-size="13" fill="#95D5B2" opacity="0.7" text-anchor="middle">Sembrando Huellas Perú</text>
  <text x="400" y="570" font-family="Arial,sans-serif" font-size="10" fill="white" opacity="0.35" text-anchor="middle">Próximamente fotografía oficial</text>
</svg>