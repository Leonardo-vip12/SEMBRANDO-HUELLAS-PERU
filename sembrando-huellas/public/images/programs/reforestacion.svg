<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6348;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="seedling" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#40916C" />
      <stop offset="100%" style="stop-color:#95D5B2" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Large seedling -->
  <rect x="396" y="280" width="8" height="120" fill="#8B6914" opacity="0.3" />
  <ellipse cx="400" cy="260" rx="50" ry="60" fill="url(#seedling)" opacity="0.35" />
  <ellipse cx="380" cy="278" rx="32" ry="38" fill="#52B788" opacity="0.28" />
  <ellipse cx="420" cy="278" rx="32" ry="38" fill="#52B788" opacity="0.28" />
  <ellipse cx="400" cy="235" rx="28" ry="35" fill="#95D5B2" opacity="0.2" />
  <!-- Small seedlings around -->
  <rect x="180" y="350" width="4" height="50" fill="#8B6914" opacity="0.2" />
  <ellipse cx="182" cy="340" rx="15" ry="18" fill="#40916C" opacity="0.2" />
  <rect x="250" y="360" width="4" height="40" fill="#8B6914" opacity="0.2" />
  <ellipse cx="252" cy="352" rx="12" ry="15" fill="#52B788" opacity="0.18" />
  <rect x="540" y="355" width="4" height="45" fill="#8B6914" opacity="0.2" />
  <ellipse cx="542" cy="345" rx="14" ry="17" fill="#40916C" opacity="0.2" />
  <rect x="620" y="360" width="4" height="40" fill="#8B6914" opacity="0.2" />
  <ellipse cx="622" cy="352" rx="12" ry="15" fill="#52B788" opacity="0.18" />
  <!-- Hands nurturing -->
  <path d="M330 380 Q320 350 340 330 Q355 320 350 365" fill="#C4956A" opacity="0.15" />
  <path d="M470 380 Q480 350 460 330 Q445 320 450 365" fill="#C4956A" opacity="0.15" />
  <!-- Ground -->
  <rect x="0" y="400" width="800" height="200" fill="#143528" opacity="0.2" />
  <!-- Water drops -->
  <circle cx="380" cy="310" r="2" fill="#95D5B2" opacity="0.2" />
  <circle cx="420" cy="305" r="1.5" fill="#95D5B2" opacity="0.15" />
  <circle cx="400" cy="320" r="1.8" fill="#95D5B2" opacity="0.18" />
  <!-- Title -->
  <text x="400" y="120" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Reforestación</text>
  <text x="400" y="520" font-family="Arial,sans-serif" font-size="11" fill="#95D5B2" opacity="0.6" text-anchor="middle">Sembrando Huellas Perú</text>
</svg>