<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B4332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#143528;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Camera/lens icon -->
  <rect x="330" y="240" width="140" height="100" fill="#2D6A4F" opacity="0.25" rx="10" />
  <circle cx="400" cy="290" r="35" fill="#143528" opacity="0.3" />
  <circle cx="400" cy="290" r="28" fill="none" stroke="#52B788" stroke-width="2" opacity="0.3" />
  <circle cx="400" cy="290" r="15" fill="#52B788" opacity="0.12" />
  <circle cx="400" cy="290" r="5" fill="#95D5B2" opacity="0.15" />
  <!-- Camera flash -->
  <rect x="440" y="250" width="20" height="12" fill="#FFD166" opacity="0.15" rx="2" />
  <!-- Social media share icons -->
  <circle cx="200" cy="200" r="18" fill="#52B788" opacity="0.15" />
  <text x="200" y="205" font-family="Arial,sans-serif" font-size="14" fill="white" opacity="0.35" text-anchor="middle">f</text>
  <circle cx="250" cy="180" r="18" fill="#52B788" opacity="0.12" />
  <text x="250" y="185" font-family="Arial,sans-serif" font-size="14" fill="rgba(255,255,255,0.18)" text-anchor="middle">t</text>
  <circle cx="550" cy="200" r="18" fill="#52B788" opacity="0.15" />
  <text x="550" y="205" font-family="Arial,sans-serif" font-size="14" fill="white" opacity="0.35" text-anchor="middle">ig</text>
  <circle cx="600" cy="180" r="18" fill="#52B788" opacity="0.12" />
  <text x="600" y="185" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="middle">yt</text>
  <!-- Trees background -->
  <rect x="100" y="350" width="5" height="80" fill="#5C4033" opacity="0.15" />
  <polygon points="102,310 80,360 125,360" fill="#2D6A4F" opacity="0.2" />
  <rect x="680" y="340" width="5" height="90" fill="#5C4033" opacity="0.15" />
  <polygon points="682,295 658,350 706,350" fill="#2D6A4F" opacity="0.2" />
  <!-- Ground -->
  <rect x="0" y="420" width="800" height="180" fill="#143528" opacity="0.15" />
  <!-- Title -->
  <text x="400" y="120" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Sensibilización</text>
  <text x="400" y="480" font-family="Arial,sans-serif" font-size="11" fill="#95D5B2" opacity="0.6" text-anchor="middle">Sembrando Huellas Perú</text>
</svg>