<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6A4F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#40916C;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#2D6A4F;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Shield shape -->
  <path d="M400 180 L480 220 L480 320 Q480 400 400 440 Q320 400 320 320 L320 220Z" fill="url(#shield)" />
  <path d="M400 180 L480 220 L480 320 Q480 400 400 440 Q320 400 320 320 L320 220Z" fill="none" stroke="#52B788" stroke-width="1.5" opacity="0.3" />
  <!-- Tree inside shield -->
  <rect x="396" y="280" width="8" height="80" fill="#5C4033" opacity="0.3" />
  <ellipse cx="400" cy="265" rx="35" ry="40" fill="#40916C" opacity="0.4" />
  <ellipse cx="385" cy="278" rx="22" ry="25" fill="#52B788" opacity="0.3" />
  <ellipse cx="415" cy="278" rx="22" ry="25" fill="#52B788" opacity="0.3" />
  <!-- Animals around shield -->
  <!-- Bird left -->
  <path d="M220 250 Q230 240 240 250" stroke="#52B788" stroke-width="1.5" fill="none" opacity="0.25" />
  <!-- Bird right -->
  <path d="M560 240 Q570 230 580 240" stroke="#52B788" stroke-width="1.5" fill="none" opacity="0.25" />
  <!-- Forest silhouette at bottom -->
  <polygon points="100,480 130,420 160,480" fill="#1B4332" opacity="0.2" />
  <polygon points="180,480 210,430 240,480" fill="#2D6A4F" opacity="0.15" />
  <polygon points="560,480 590,425 620,480" fill="#1B4332" opacity="0.2" />
  <polygon points="640,480 670,435 700,480" fill="#2D6A4F" opacity="0.15" />
  <!-- Ground -->
  <rect x="0" y="480" width="800" height="120" fill="#143528" opacity="0.15" />
  <!-- Title -->
  <text x="400" y="120" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Conservación</text>
  <text x="400" y="520" font-family="Arial,sans-serif" font-size="11" fill="#95D5B2" opacity="0.6" text-anchor="middle">Sembrando Huellas Perú</text>
</svg>