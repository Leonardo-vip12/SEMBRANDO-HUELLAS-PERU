<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#143528;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6A4F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- People in circle (community gathering) -->
  <circle cx="400" cy="300" r="100" fill="none" stroke="#52B788" stroke-width="1" opacity="0.15" stroke-dasharray="5,5" />
  <!-- People around circle -->
  <circle cx="400" cy="200" r="16" fill="#C4956A" opacity="0.2" />
  <circle cx="480" cy="225" r="16" fill="#C4956A" opacity="0.18" />
  <circle cx="500" cy="300" r="16" fill="#C4956A" opacity="0.2" />
  <circle cx="480" cy="375" r="16" fill="#C4956A" opacity="0.18" />
  <circle cx="400" cy="400" r="16" fill="#C4956A" opacity="0.2" />
  <circle cx="320" cy="375" r="16" fill="#C4956A" opacity="0.18" />
  <circle cx="300" cy="300" r="16" fill="#C4956A" opacity="0.2" />
  <circle cx="320" cy="225" r="16" fill="#C4956A" opacity="0.18" />
  <!-- Connecting hands (lines between people) -->
  <line x1="415" y1="210" x2="465" y2="220" stroke="#C4956A" stroke-width="1" opacity="0.12" />
  <line x1="495" y1="240" x2="500" y2="285" stroke="#C4956A" stroke-width="1" opacity="0.12" />
  <line x1="495" y1="315" x2="490" y2="360" stroke="#C4956A" stroke-width="1" opacity="0.12" />
  <line x1="465" y1="385" x2="415" y2="395" stroke="#C4956A" stroke-width="1" opacity="0.12" />
  <line x1="385" y1="395" x2="335" y2="385" stroke="#C4956A" stroke-width="1" opacity="0.12" />
  <line x1="310" y1="360" x2="305" y2="315" stroke="#C4956A" stroke-width="1" opacity="0.12" />
  <line x1="305" y1="285" x2="310" y2="240" stroke="#C4956A" stroke-width="1" opacity="0.12" />
  <line x1="325" y1="220" x2="385" y2="210" stroke="#C4956A" stroke-width="1" opacity="0.12" />
  <!-- Center tree icon -->
  <rect x="397" y="290" width="6" height="30" fill="#5C4033" opacity="0.2" />
  <ellipse cx="400" cy="280" rx="18" ry="20" fill="#52B788" opacity="0.25" />
  <ellipse cx="390" cy="288" rx="10" ry="12" fill="#40916C" opacity="0.2" />
  <ellipse cx="410" cy="288" rx="10" ry="12" fill="#40916C" opacity="0.2" />
  <!-- Trees in background -->
  <rect x="80" y="340" width="5" height="60" fill="#5C4033" opacity="0.15" />
  <polygon points="82,300 65,350 100,350" fill="#2D6A4F" opacity="0.2" />
  <rect x="700" y="330" width="5" height="70" fill="#5C4033" opacity="0.15" />
  <polygon points="702,285 682,340 722,340" fill="#2D6A4F" opacity="0.2" />
  <!-- Ground -->
  <rect x="0" y="420" width="800" height="180" fill="#143528" opacity="0.15" />
  <!-- Title -->
  <text x="400" y="120" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Participación Ciudadana</text>
  <text x="400" y="520" font-family="Arial,sans-serif" font-size="11" fill="#95D5B2" opacity="0.6" text-anchor="middle">Sembrando Huellas Perú</text>
</svg>