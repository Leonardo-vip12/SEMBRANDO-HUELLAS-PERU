<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B4332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6A4F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Book with leaves growing -->
  <rect x="310" y="280" width="180" height="130" fill="#143528" opacity="0.35" rx="4" />
  <rect x="315" y="285" width="170" height="120" fill="#0D2B1A" opacity="0.2" rx="2" />
  <line x1="400" y1="285" x2="400" y2="405" stroke="#40916C" stroke-width="1" opacity="0.2" />
  <!-- Pages lines -->
  <line x1="330" y1="310" x2="390" y2="310" stroke="#52B788" stroke-width="0.8" opacity="0.15" />
  <line x1="330" y1="325" x2="385" y2="325" stroke="#52B788" stroke-width="0.8" opacity="0.12" />
  <line x1="330" y1="340" x2="380" y2="340" stroke="#52B788" stroke-width="0.8" opacity="0.1" />
  <line x1="410" y1="310" x2="470" y2="310" stroke="#52B788" stroke-width="0.8" opacity="0.15" />
  <line x1="410" y1="325" x2="465" y2="325" stroke="#52B788" stroke-width="0.8" opacity="0.12" />
  <line x1="410" y1="340" x2="460" y2="340" stroke="#52B788" stroke-width="0.8" opacity="0.1" />
  <!-- Plant growing from book -->
  <rect x="398" y="220" width="4" height="65" fill="#40916C" opacity="0.3" />
  <ellipse cx="400" cy="210" rx="25" ry="28" fill="#52B788" opacity="0.3" />
  <ellipse cx="385" cy="225" rx="18" ry="20" fill="#40916C" opacity="0.25" />
  <ellipse cx="415" cy="225" rx="18" ry="20" fill="#40916C" opacity="0.25" />
  <!-- Pencils -->
  <rect x="520" y="300" width="6" height="80" fill="#FFD166" opacity="0.2" rx="1" transform="rotate(10 523 340)" />
  <rect x="540" y="305" width="6" height="75" fill="#D90429" opacity="0.15" rx="1" transform="rotate(5 543 342)" />
  <rect x="260" y="305" width="6" height="75" fill="#52B788" opacity="0.2" rx="1" transform="rotate(-8 263 342)" />
  <!-- Graduation cap -->
  <polygon points="400,150 355,170 400,190 445,170" fill="#143528" opacity="0.3" />
  <rect x="385" y="170" width="30" height="5" fill="#143528" opacity="0.25" />
  <path d="M400 155 L400 140" stroke="#FFD166" stroke-width="1" opacity="0.2" />
  <circle cx="400" cy="138" r="3" fill="#FFD166" opacity="0.15" />
  <!-- Title -->
  <text x="400" y="100" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Educación Ambiental</text>
  <text x="400" y="480" font-family="Arial,sans-serif" font-size="11" fill="#95D5B2" opacity="0.6" text-anchor="middle">Sembrando Huellas Perú</text>
</svg>