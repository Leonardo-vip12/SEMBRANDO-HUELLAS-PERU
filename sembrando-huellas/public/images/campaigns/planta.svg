<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2B1A"/>
      <stop offset="30%" stop-color="#143528"/>
      <stop offset="60%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="soil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#0D2B1A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Background forest -->
  <ellipse cx="100" cy="300" rx="80" ry="50" fill="#1B4332" opacity="0.4"/>
  <ellipse cx="250" cy="290" rx="90" ry="55" fill="#2D6A4F" opacity="0.3"/>
  <ellipse cx="550" cy="295" rx="85" ry="52" fill="#1B4332" opacity="0.4"/>
  <ellipse cx="700" cy="300" rx="75" ry="48" fill="#2D6A4F" opacity="0.3"/>
  
  <!-- Ground -->
  <ellipse cx="400" cy="400" rx="350" ry="60" fill="url(#soil)" opacity="0.6"/>
  
  <!-- Hole in ground -->
  <ellipse cx="400" cy="380" rx="60" ry="15" fill="#0D2B1A" opacity="0.8"/>
  <ellipse cx="400" cy="378" rx="55" ry="12" fill="#143528" opacity="0.6"/>
  
  <!-- Hands planting sapling -->
  <g transform="translate(400, 320)">
    <!-- Left hand -->
    <path d="M-40 30c-5-10-8-20-5-30c3-8 10-12 15-10c4 2 6 8 5 15l-2 15c-3 8-8 12-13 10z" fill="#D4A574" opacity="0.9"/>
    <path d="M-35 25c-2-8 0-16 4-22c2-4 6-6 8-4c2 2 2 6 1 10l-1 8c-4 6-8 8-12 8z" fill="#D4A574" opacity="0.85"/>
    <path d="M-30 20c0-6 2-12 6-16c2-2 4-3 5-1c1 2 1 5 0 8l-2 6c-3 4-6 5-9 3z" fill="#D4A574" opacity="0.8"/>
    
    <!-- Right hand -->
    <path d="M40 30c5-10 8-20 5-30c-3-8-10-12-15-10c-4 2-6 8-5 15l2 15c3 8 8 12 13 10z" fill="#D4A574" opacity="0.9"/>
    <path d="M35 25c2-8 0-16-4-22c-2-4-6-6-8-4c-2 2-2 6-1 10l1 8c4 6 8 8 12 8z" fill="#D4A574" opacity="0.85"/>
    <path d="M30 20c0-6-2-12-6-16c-2-2-4-3-5-1c-1 2-1 5 0 8l2 6c3 4 6 5 9 3z" fill="#D4A574" opacity="0.8"/>
    
    <!-- Sapling -->
    <rect x="-2" y="-40" width="4" height="50" fill="#2D6A4F" rx="2"/>
    
    <!-- Leaves -->
    <path d="M2-30c8-5 14-12 12-20c-6 2-10 8-12 20z" fill="#52B788"/>
    <path d="M-2-25c-8-5-14-12-12-20c6 2 10 8 12 20z" fill="#52B788"/>
    <path d="M0-35c5-8 8-16 6-22c-4 2-6 8-6 22z" fill="#40916C"/>
    <path d="M0-38c-4-6-6-12-4-16c3 1 4 6 4 16z" fill="#95D5B2" opacity="0.7"/>
    
    <!-- Small roots at base -->
    <path d="M0 10c-5 3-10 5-15 4" stroke="#1B4332" stroke-width="2" fill="none"/>
    <path d="M0 10c5 3 10 5 15 4" stroke="#1B4332" stroke-width="2" fill="none"/>
    <path d="M0 12c-3 4-5 8-4 12" stroke="#1B4332" stroke-width="1.5" fill="none"/>
    <path d="M0 12c3 4 5 8 4 12" stroke="#1B4332" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Water drops -->
  <path d="M380 250l-2 8l2 3l2-3l-2-8z" fill="#95D5B2" opacity="0.5"/>
  <path d="M420 260l-2 8l2 3l2-3l-2-8z" fill="#95D5B2" opacity="0.4"/>
  <path d="M395 240l-1.5 6l1.5 2l1.5-2l-1.5-6z" fill="#95D5B2" opacity="0.3"/>
  
  <!-- Surrounding small plants -->
  <g transform="translate(300, 360)">
    <rect x="-1" y="0" width="2" height="12" fill="#40916C"/>
    <path d="M1 5c4-3 7-6 6-10c-4 1-5 5-6 10z" fill="#52B788" opacity="0.7"/>
    <path d="M-1 3c-4-3-7-6-6-10c4 1 5 5 6 10z" fill="#52B788" opacity="0.6"/>
  </g>
  
  <g transform="translate(500, 365)">
    <rect x="-1" y="0" width="2" height="10" fill="#40916C"/>
    <path d="M1 4c3-2 5-5 4-8c-3 1-4 4-4 8z" fill="#52B788" opacity="0.6"/>
    <path d="M-1 2c-3-2-5-5-4-8c3 1 4 4 4 8z" fill="#52B788" opacity="0.5"/>
  </g>
  
  <!-- Sun rays in corner -->
  <g transform="translate(700, 50)">
    <circle cx="0" cy="0" r="25" fill="#95D5B2" opacity="0.15"/>
    <circle cx="0" cy="0" r="18" fill="#95D5B2" opacity="0.1"/>
    <circle cx="0" cy="0" r="10" fill="#95D5B2" opacity="0.2"/>
    <line x1="0" y1="-35" x2="0" y2="-25" stroke="#95D5B2" stroke-width="2" opacity="0.2"/>
    <line x1="35" y1="0" x2="25" y2="0" stroke="#95D5B2" stroke-width="2" opacity="0.2"/>
    <line x1="25" y1="-25" x2="18" y2="-18" stroke="#95D5B2" stroke-width="2" opacity="0.2"/>
    <line x1="25" y1="25" x2="18" y2="18" stroke="#95D5B2" stroke-width="2" opacity="0.2"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="white" opacity="0.9" font-weight="bold">Sembrando Huellas Perú</text>
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#95D5B2" opacity="0.8">Campaña Plantación</text>
  
  <!-- Bottom text -->
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" opacity="0.6">Cada árbol cuenta, cada acción importa</text>
</svg>