<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2B1A"/>
      <stop offset="25%" stop-color="#143528"/>
      <stop offset="50%" stop-color="#1B4332"/>
      <stop offset="75%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#40916C"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="50%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Sky/atmosphere -->
  <ellipse cx="400" cy="50" rx="300" ry="30" fill="#95D5B2" opacity="0.1"/>
  
  <!-- Background mountains -->
  <path d="M0 250L100 180L200 220L300 150L400 200L500 130L600 190L700 160L800 210L800 250Z" fill="#0D2B1A" opacity="0.5"/>
  
  <!-- Dense forest -->
  <ellipse cx="100" cy="230" rx="50" ry="35" fill="#1B4332" opacity="0.8"/>
  <ellipse cx="200" cy="220" rx="60" ry="40" fill="#2D6A4F" opacity="0.7"/>
  <ellipse cx="350" cy="225" rx="55" ry="38" fill="#1B4332" opacity="0.8"/>
  <ellipse cx="500" cy="218" rx="65" ry="42" fill="#2D6A4F" opacity="0.7"/>
  <ellipse cx="650" cy="222" rx="58" ry="36" fill="#1B4332" opacity="0.8"/>
  <ellipse cx="750" cy="228" rx="45" ry="30" fill="#2D6A4F" opacity="0.7"/>
  
  <!-- Main trees -->
  <rect x="145" y="200" width="10" height="50" fill="#0D2B1A"/>
  <ellipse cx="150" cy="180" rx="30" ry="25" fill="#40916C"/>
  <ellipse cx="150" cy="172" rx="20" ry="16" fill="#52B788"/>
  
  <rect x="395" y="195" width="12" height="55" fill="#0D2B1A"/>
  <ellipse cx="401" cy="172" rx="35" ry="28" fill="#40916C"/>
  <ellipse cx="401" cy="164" rx="24" ry="18" fill="#52B788"/>
  
  <rect x="595" y="200" width="11" height="50" fill="#0D2B1A"/>
  <ellipse cx="600" cy="178" rx="32" ry="26" fill="#40916C"/>
  <ellipse cx="600" cy="170" rx="22" ry="17" fill="#52B788"/>
  
  <!-- River -->
  <path d="M0 280Q100 270 200 280T400 275T600 280T800 270L800 320Q700 310 600 320T400 315T200 320T0 310Z" fill="url(#water)" opacity="0.6"/>
  <path d="M0 290Q150 280 300 290T600 285T800 290" stroke="#95D5B2" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M0 300Q200 290 400 300T800 295" stroke="#95D5B2" stroke-width="1.5" fill="none" opacity="0.2"/>
  
  <!-- River reflections -->
  <ellipse cx="200" cy="300" rx="30" ry="3" fill="#95D5B2" opacity="0.1"/>
  <ellipse cx="500" cy="295" rx="25" ry="2" fill="#95D5B2" opacity="0.1"/>
  
  <!-- Wildlife -->
  <!-- Macaw -->
  <g transform="translate(120, 150)">
    <ellipse cx="0" cy="0" rx="8" ry="5" fill="#52B788"/>
    <circle cx="-8" cy="-2" r="3" fill="#40916C"/>
    <path d="M-11-2l-3-1l3 1l-3 1" stroke="#95D5B2" stroke-width="1"/>
    <path d="M8 0l12-3l-2 3l2 3l-12-3z" fill="#52B788" opacity="0.7"/>
  </g>
  
  <!-- Monkey -->
  <g transform="translate(680, 170)">
    <circle cx="0" cy="0" r="5" fill="#2D6A4F"/>
    <path d="M-5 0Q-10 5-8 10" stroke="#2D6A4F" stroke-width="2" fill="none"/>
    <circle cx="-2" cy="-1" r="1" fill="#95D5B2"/>
  </g>
  
  <!-- Fish in river -->
  <path d="M300 300l-8-3l8-3l4 3l-4 3z" fill="#95D5B2" opacity="0.4"/>
  <path d="M550 305l-6-2l6-2l3 2l-3 2z" fill="#95D5B2" opacity="0.3"/>
  
  <!-- Butterfly -->
  <g transform="translate(250, 140)">
    <ellipse cx="-4" cy="0" rx="4" ry="3" fill="#52B788" opacity="0.6" transform="rotate(-20)"/>
    <ellipse cx="4" cy="0" rx="4" ry="3" fill="#52B788" opacity="0.6" transform="rotate(20)"/>
    <rect x="-0.5" y="-3" width="1" height="6" fill="#40916C"/>
  </g>
  
  <!-- Foreground vegetation -->
  <path d="M0 400Q50 380 100 400T200 390T300 400T400 385T500 400T600 390T700 400T800 388L800 450L0 450Z" fill="#0D2B1A" opacity="0.6"/>
  <path d="M0 410Q100 395 200 410T400 400T600 410T800 400L800 450L0 450Z" fill="#143528" opacity="0.5"/>
  
  <!-- Ferns -->
  <path d="M50 400c0-20 10-30 15-40" stroke="#52B788" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M55 395c-5-8-3-15 0-20" stroke="#40916C" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M750 405c0-18 8-28 12-38" stroke="#52B788" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="white" opacity="0.9" font-weight="bold">Sembrando Huellas Perú</text>
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#95D5B2" opacity="0.8">Campaña Amazonía</text>
  
  <!-- Bottom text -->
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" opacity="0.6">Protegiendo el corazón verde del Perú</text>
</svg>