  <ellipse cx="430" cy="300" rx="35" ry="42" fill="#1B4332" stroke="#40916C" stroke-width="1.5" opacity="0.3" />
  <circle cx="370" cy="300" r="25" fill="#52B788" opacity="0.12" />
  <circle cx="430" cy="300" r="25" fill="#52B788" opacity="0.12" />
  <rect x="398" y="280" width="14" height="18" fill="#2D6A4F" opacity="0.25" rx="3" />
