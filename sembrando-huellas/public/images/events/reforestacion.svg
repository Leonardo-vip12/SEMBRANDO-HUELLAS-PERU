<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#143528;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6A4F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- People planting in forest -->
  <rect x="0" y="400" width="800" height="200" fill="#143528" opacity="0.2" />
  <!-- Trees -->
  <rect x="100" y="200" width="8" height="200" fill="#5C4033" opacity="0.25" />
  <polygon points="104,140 70,220 138,220" fill="#2D6A4F" opacity="0.35" />
  <rect x="300" y="180" width="10" height="220" fill="#5C4033" opacity="0.25" />
  <polygon points="305,110 260,200 350,200" fill="#2D6A4F" opacity="0.4" />
  <rect x="500" y="190" width="8" height="210" fill="#5C4033" opacity="0.25" />
  <polygon points="504,125 465,210 543,210" fill="#2D6A4F" opacity="0.35" />
  <rect x="680" y="210" width="8" height="190" fill="#5C4033" opacity="0.2" />
  <polygon points="684,155 655,220 713,220" fill="#2D6A4F" opacity="0.3" />
  <!-- People silhouettes working -->
  <circle cx="200" cy="360" r="12" fill="#C4956A" opacity="0.15" />
  <rect x="196" y="372" width="8" height="25" fill="#1B4332" opacity="0.12" />
  <circle cx="400" cy="355" r="12" fill="#C4956A" opacity="0.15" />
  <rect x="396" y="367" width="8" height="28" fill="#1B4332" opacity="0.12" />
  <circle cx="600" cy="360" r="12" fill="#C4956A" opacity="0.15" />
  <rect x="596" y="372" width="8" height="25" fill="#1B4332" opacity="0.12" />
  <!-- Small saplings being planted -->
  <rect x="250" y="380" width="3" height="20" fill="#8B6914" opacity="0.2" />
  <ellipse cx="251" cy="375" rx="8" ry="10" fill="#52B788" opacity="0.2" />
  <rect x="450" y="382" width="3" height="18" fill="#8B6914" opacity="0.2" />
  <ellipse cx="451" cy="377" rx="8" ry="10" fill="#52B788" opacity="0.2" />
  <rect x="550" y="378" width="3" height="22" fill="#8B6914" opacity="0.2" />
  <ellipse cx="551" cy="372" rx="8" ry="10" fill="#52B788" opacity="0.2" />
  <!-- Title -->
  <text x="400" y="100" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Reforestación Comunitaria</text>
  <text x="400" y="130" font-family="Arial,sans-serif" font-size="13" fill="#95D5B2" opacity="0.7" text-anchor="middle">Sembrando Huellas Perú</text>
  <text x="400" y="570" font-family="Arial,sans-serif" font-size="10" fill="white" opacity="0.35" text-anchor="middle">Próximamente fotografía oficial</text>
</svg>