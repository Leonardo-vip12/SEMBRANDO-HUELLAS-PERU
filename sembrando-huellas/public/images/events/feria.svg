<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#143528;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6A4F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <!-- Tent/stall structures -->
  <polygon points="150,250 250,180 350,250" fill="#2D6A4F" opacity="0.25" />
  <rect x="170" y="250" width="160" height="100" fill="#1B4332" opacity="0.2" />
  <polygon points="350,250 450,180 550,250" fill="#40916C" opacity="0.2" />
  <rect x="370" y="250" width="160" height="100" fill="#143528" opacity="0.2" />
  <polygon points="550,250 650,180 750,250" fill="#2D6A4F" opacity="0.25" />
  <rect x="570" y="250" width="160" height="100" fill="#1B4332" opacity="0.2" />
  <!-- Display items on stalls -->
  <rect x="190" y="260" width="40" height="25" fill="#52B788" opacity="0.15" rx="2" />
  <rect x="240" y="265" width="35" height="20" fill="#40916C" opacity="0.12" rx="2" />
  <rect x="390" y="260" width="40" height="25" fill="#52B788" opacity="0.15" rx="2" />
  <rect x="440" y="265" width="35" height="20" fill="#40916C" opacity="0.12" rx="2" />
  <rect x="590" y="260" width="40" height="25" fill="#52B788" opacity="0.15" rx="2" />
  <rect x="640" y="265" width="35" height="20" fill="#40916C" opacity="0.12" rx="2" />
  <!-- People walking -->
  <circle cx="130" cy="380" r="10" fill="#C4956A" opacity="0.12" />
  <rect x="126" y="390" width="8" height="22" fill="#1B4332" opacity="0.1" />
  <circle cx="300" cy="385" r="10" fill="#C4956A" opacity="0.12" />
  <rect x="296" y="395" width="8" height="20" fill="#D90429" opacity="0.08" />
  <circle cx="500" cy="380" r="10" fill="#C4956A" opacity="0.12" />
  <rect x="496" y="390" width="8" height="22" fill="#2D6A4F" opacity="0.1" />
  <circle cx="680" cy="385" r="10" fill="#C4956A" opacity="0.12" />
  <rect x="676" y="395" width="8" height="20" fill="#FFD166" opacity="0.08" />
  <!-- Bunting/flags between stalls -->
  <path d="M150 230 Q200 240 250 230 Q300 240 350 230" stroke="#52B788" stroke-width="1" fill="none" opacity="0.15" />
  <path d="M350 230 Q400 240 450 230 Q500 240 550 230" stroke="#D90429" stroke-width="1" fill="none" opacity="0.12" />
  <!-- Ground -->
  <rect x="0" y="350" width="800" height="250" fill="#143528" opacity="0.15" />
  <!-- Title -->
  <text x="400" y="120" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">Feria Ambiental</text>
  <text x="400" y="150" font-family="Arial,sans-serif" font-size="13" fill="#95D5B2" opacity="0.7" text-anchor="middle">Sembrando Huellas Perú</text>
  <text x="400" y="570" font-family="Arial,sans-serif" font-size="10" fill="white" opacity="0.35" text-anchor="middle">Próximamente fotografía oficial</text>
</svg>