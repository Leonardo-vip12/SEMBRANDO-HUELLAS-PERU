<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="30%" stop-color="#2D6A4F"/>
      <stop offset="60%" stop-color="#40916C"/>
      <stop offset="100%" stop-color="#2D6348"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="white" opacity="0.9" font-weight="bold">Sembrando Huellas Perú</text>
  <text x="400" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" opacity="0.6">Nuestro Camino</text>
  
  <!-- Timeline line -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#40916C" stroke-width="3" opacity="0.6"/>
  
  <!-- Forest panorama -->
  <g transform="translate(200, 110)">
    <!-- Background mountains -->
    <path d="M0 80L50 40L100 60L200 20L300 50L400 30L400 80Z" fill="#1B4332" opacity="0.4"/>
    
    <!-- Trees in distance -->
    <ellipse cx="80" cy="65" rx="20" ry="15" fill="#2D6A4F" opacity="0.6"/>
    <ellipse cx="150" cy="55" rx="25" ry="20" fill="#2D6A4F" opacity="0.7"/>
    <ellipse cx="250" cy="60" rx="22" ry="18" fill="#2D6A4F" opacity="0.65"/>
    <ellipse cx="320" cy="58" rx="18" ry="14" fill="#2D6A4F" opacity="0.6"/>
    
    <!-- Main trees -->
    <rect x="90" y="70" width="8" height="20" fill="#1B4332"/>
    <ellipse cx="94" cy="60" rx="18" ry="15" fill="#40916C"/>
    <ellipse cx="94" cy="55" rx="12" ry="10" fill="#52B788"/>
    
    <rect x="180" y="65" width="10" height="25" fill="#1B4332"/>
    <ellipse cx="185" cy="52" rx="22" ry="18" fill="#40916C"/>
    <ellipse cx="185" cy="47" rx="15" ry="12" fill="#52B788"/>
    
    <rect x="280" y="68" width="9" height="22" fill="#1B4332"/>
    <ellipse cx="284" cy="56" rx="20" ry="16" fill="#40916C"/>
    <ellipse cx="284" cy="51" rx="13" ry="11" fill="#52B788"/>
    
    <!-- River -->
    <path d="M0 85Q100 80 200 85T400 80" stroke="#95D5B2" stroke-width="4" fill="none" opacity="0.5"/>
    <path d="M0 90Q100 85 200 90T400 85" stroke="#95D5B2" stroke-width="2" fill="none" opacity="0.3"/>
    
    <!-- Wildlife silhouettes -->
    <circle cx="130" cy="45" r="3" fill="#95D5B2" opacity="0.5"/>
    <path d="M220 40l5-3l5 3l-5 3z" fill="#95D5B2" opacity="0.4"/>
    <path d="M350 50c2-4 6-4 8 0c-2 1-4 2-4 2s-2-1-4-2z" fill="#95D5B2" opacity="0.4"/>
  </g>
  
  <!-- Year -->
  <text x="400" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="white" opacity="0.9" font-weight="bold">2022</text>
  
  <!-- Description -->
  <text x="400" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#95D5B2">Impacto</text>
  <text x="400" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" opacity="0.7">Resultados tangibles en conservación amazónica</text>
</svg>