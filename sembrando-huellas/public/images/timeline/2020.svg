<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143528"/>
      <stop offset="30%" stop-color="#1B4332"/>
      <stop offset="60%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#2D6348"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#52B788"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="white" opacity="0.9" font-weight="bold">Sembrando Huellas Perú</text>
  <text x="400" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" opacity="0.6">Nuestro Camino</text>
  
  <!-- Timeline line -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#40916C" stroke-width="3" opacity="0.6"/>
  
  <!-- Growing tree icon -->
  <g transform="translate(370, 100)">
    <!-- Trunk -->
    <rect x="25" y="80" width="10" height="40" fill="url(#trunk)" rx="2"/>
    <!-- Branches -->
    <path d="M30 80c-15-5-25-15-20-25c8 5 15 15 20 25z" fill="#2D6A4F"/>
    <path d="M30 80c15-5 25-15 20-25c-8 5-15 15-20 25z" fill="#2D6A4F"/>
    <!-- Canopy layers -->
    <ellipse cx="30" cy="50" rx="35" ry="25" fill="url(#canopy)" opacity="0.8"/>
    <ellipse cx="25" cy="45" rx="25" ry="18" fill="#40916C" opacity="0.7"/>
    <ellipse cx="35" cy="45" rx="25" ry="18" fill="#40916C" opacity="0.7"/>
    <ellipse cx="30" cy="40" rx="20" ry="15" fill="#52B788" opacity="0.6"/>
    <!-- Small leaves -->
    <circle cx="15" cy="55" r="3" fill="#95D5B2" opacity="0.4"/>
    <circle cx="45" cy="55" r="3" fill="#95D5B2" opacity="0.4"/>
    <circle cx="30" cy="30" r="2" fill="#95D5B2" opacity="0.3"/>
  </g>
  
  <!-- Year -->
  <text x="400" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="white" opacity="0.9" font-weight="bold">2020</text>
  
  <!-- Description -->
  <text x="400" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#95D5B2">Crecimiento</text>
  <text x="400" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white" opacity="0.7">Fortalecimiento de proyectos y alianzas estratégicas</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="350" r="3" fill="#52B788" opacity="0.3"/>
  <circle cx="700" cy="350" r="3" fill="#52B788" opacity="0.3"/>
</svg>