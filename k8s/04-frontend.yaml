apiVersion: apps/v1
kind: Deployment
metadata:
  name: sh-frontend
  namespace: sembrando-huellas-prod
  labels:
    app: sh-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sh-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sh-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/sembrando-huellas/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sh-frontend-service
  namespace: sembrando-huellas-prod
spec:
  type: ClusterIP
  selector:
    app: sh-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
