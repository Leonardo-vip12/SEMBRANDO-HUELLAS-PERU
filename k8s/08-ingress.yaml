apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sh-ingress
  namespace: sembrando-huellas-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://sembrandohuellas.pe,https://admin.sembrandohuellas.pe"
spec:
  tls:
    - hosts:
        - sembrandohuellas.pe
        - www.sembrandohuellas.pe
        - api.sembrandohuellas.pe
        - admin.sembrandohuellas.pe
      secretName: sembrando-huellas-tls
  rules:
    - host: sembrandohuellas.pe
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sh-frontend-service
                port:
                  number: 80
    - host: www.sembrandohuellas.pe
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sh-frontend-service
                port:
                  number: 80
    - host: api.sembrandohuellas.pe
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sh-backend-service
                port:
                  number: 3000
    - host: admin.sembrandohuellas.pe
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sh-cms-service
                port:
                  number: 80
