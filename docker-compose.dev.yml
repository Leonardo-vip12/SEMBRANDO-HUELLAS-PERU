version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: sh-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sembrando_huellas_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - sh-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sh-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - sh-dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-20T22-40-07Z
    container_name: sh-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    networks:
      - sh-dev-net

  backend:
    build:
      context: ./sembrando-huellas-backend
      dockerfile: Dockerfile.dev
    container_name: sh-backend-dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-sembrando_huellas_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    volumes:
      - ./sembrando-huellas-backend:/app
      - /app/node_modules
    networks:
      - sh-dev-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./sembrando-huellas
      dockerfile: Dockerfile
    container_name: sh-frontend-dev
    ports:
      - "8080:80"
    networks:
      - sh-dev-net
    depends_on:
      - backend

networks:
  sh-dev-net:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
