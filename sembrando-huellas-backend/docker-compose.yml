version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sh-api
    ports:
      - '3000:3000'
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sh-network

  postgres:
    image: postgres:16-alpine
    container_name: sh-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: sembrando_huellas
      POSTGRES_USER: sh_user
      POSTGRES_PASSWORD: sh_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sh_user -d sembrando_huellas']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sh-network

  redis:
    image: redis:7-alpine
    container_name: sh-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - sh-network

  minio:
    image: minio/minio:latest
    container_name: sh-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: sh_minio
      MINIO_ROOT_PASSWORD: sh_minio_secret
    volumes:
      - minio-data:/data
    command: server /data --console-address ':9001'
    networks:
      - sh-network

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  sh-network:
    driver: bridge
